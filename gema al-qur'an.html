                            <p class="p2">&emsp;Binayah adalah suatu program pembelajaran yang di desain untuk menciptakan dan mewujudkan para Hafidz wa Hafidzah di dalam kampus Ma’had Al-Zaytun, konsep atau metode pembelajaran yang digunakan didalam program ini menggunakan metode ritme otak, yang dimana metode ini sudah pernah digunakan selama periode 2023-2024 dan telah mewujudkan dan menghasilkan Hafidz wa Hafidzah yang berbakat. <br/><br>&emsp;Tujuan dibuatnya program ini adalah untuk menciptakan dan membantu para santri Ma’had Al-Zaytun supaya dapat memahami Al-Qur’an secara mendalam seperti yang ada dalam Takhsis Ma’had Al-Zaytun.</p> 
                            <p class="p2">Adapun hasil yang dapat diwujudkan dalam program ini adalah :<br>&emsp;1. Santri dapat memahami isi kandungan yang terdapat didalam Al-Qur’an.<br>&emsp;2. Santri mampu membaca dan menghafal Al-Qur’an dengan baik.</p>

                            <p class="p2">Dalam kegiatan Binayah ini terbagi menjadi beberapa tempat pembelajaran dan kurikulum pembelajaran yang berbeda yaitu :</p>
                            <p class="p2">1. Asrama Pelajar :</p>
                            <p class="p2">&emsp;• Asrama Al-Madani, bagi santri dengan keriteria khusus, yang di ajarkan untuk dapat memahami Al-Qur’an secara mendalam dan dapat memahami arti dari ayat-ayat yang terdapat didalam Al-Qur’an.</p>
                            <p class="p2">&emsp;• Asrama Al-Fajr, bagi santri dengan keriteria grade C, di sini adalah kelompok santri yang belum lancar dalam membaca Al-Qur'an, dan di ajarkan dengan metode ritme otak.</p>
                            <p class="p2">&emsp;• Asrama Al-Musthafa, bagi santri dengan keriteria grade A, di sini adalah kelompok santri yang sudah lancar dalam membaca Al-Qur'an dan santri yang berada dalam kelompok ini di targetkan untuk menghafal beberapa juz.</p>
                            <p class="p2">&emsp;• Asrama Al-Nur, bagi santri dengan keriteria grade C, di sini adalah kelompok santri yang belum lancar dalam membaca Al-Qur'an, dan di ajarkan dengan metode ritme otak.</p>
                            <p class="p2">&emsp;• Asrama Persahabatan, bagi santri dengan keriteria MI, ini adalah asrama para santri Madrasah Ibtidaiyah yang di mana santri di bagi menjadi beberapa kelompok, ada kelompok yang belum bisa membaca Al-Qur'an dengan baik dan kelompok yang sudah dapat membaca Al-Qur'an dengan baik, bagi yang belum bisa membaca Al-Qur'an dengan baik di ajarkan menggunakan buku Iqro dan bagi yang sudah dapat membaca Al-Qur'an dengan baik di targetkan untuk menghafal juz 30.</p>
                            <p class="p2">2. Masjid Al-Hayat : Bagi santri dengan kriteria grade A dan B, untuk pembelajaran grade A di Masjid Al-Hayat para santri ditargetkan untuk menghafal beberapa juz namun terdapat beberapa pembelajaran tambahan yaitu, Tazyin, yang didalamnya berisi tentang pembelajaran MTQ (Musabaqah Tilawah Qur'an) dan MMQ (Musabaqah Muratal Qur'an) sedangkan bagi santri dengan keriteria grade B pembelajarannya adalah menghafalkan juz 1, 29, dan 30.</p>
